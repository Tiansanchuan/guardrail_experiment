# 转账任务最小 pilot。复制为 va_bank_pilot.local.yaml 后填写模型。
# 模型和 API key 均未预选；provider 的 openai 只是可编辑的模板值。
# API key 的值放终端环境变量，不放本文件。程序不会自动读取 .env。
schema_version: va-experiment-v1
task_ids:
  - bank_transfer_2

# 起步建议：正常目标1次、违规目标1次，共2条执行、4份报告。
# 这是可行性检查规模，不用于显著性或等效性结论。
repetitions_per_goal: 1

actor:
  # 当前可选 openai / anthropic；使用支持现有工具和生成参数格式的模型。
  provider: openai
  model_id: null  # 必填：服务商接受的完整模型ID，不能填展示名称。
  api_key_env: VA_ACTOR_API_KEY
  temperature: 0.0
  # 每次执行回复及每份普通/VA报告均使用这一输出上限。
  max_output_tokens: 4096

# 评估：null 表示 run 不调用评估模型（用户2026-11-12决定改由Claude子agent外部评估）。
# run 完成后用 export-assessments 导出盲评请求，再用 import-assessments 校验导入。
# 恢复API评估：把下面整段改回 provider/model_id/api_key_env/temperature/max_output_tokens。
assessment: null

# 每条执行最多40次actor回复；一条回复可能含多个工具调用。
# 若达到此上限，轨迹保留并标记预算结束，不算自然完成。
max_actor_turns: 40

# 相对本配置文件所在目录解析；每次run创建独立子目录。
output_dir: ../va_runs/bank_pilot
# 只固定报告/评估的调度顺序，不等于模型推理随机种子。
order_seed: 0
